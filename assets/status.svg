<svg width="480" height="40" viewBox="0 0 480 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    .dot { animation: pulse 1.8s ease-in-out infinite; transform-origin: 24px 20px; }
    @keyframes pulse {
      0%   { opacity: 1; transform: scale(1); }
      50%  { opacity: 0.35; transform: scale(1.6); }
      100% { opacity: 1; transform: scale(1); }
    }
    .label {
      font-family: 'Consolas','SFMono-Regular','Courier New',monospace;
      font-weight: 700; letter-spacing: 1.5px; fill: #22D3EE; font-size: 13px;
    }
  </style>
  <rect x="0" y="0" width="480" height="40" rx="20" fill="#0A0D18"/>
  <circle cx="24" cy="20" r="5" fill="#22D3EE" class="dot"/>
  <text x="42" y="25" class="label">CURRENTLY BUILDING NEURALVAULT</text>
</svg>
