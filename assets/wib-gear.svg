<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .gear { animation: spin 4s linear infinite; transform-origin: 16px 16px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <g class="gear" fill="#7C3AED">
    <circle cx="16" cy="16" r="5.5"/>
    <g>
      <rect x="14" y="2" width="4" height="6" rx="1"/>
      <rect x="14" y="24" width="4" height="6" rx="1"/>
      <rect x="2" y="14" width="6" height="4" rx="1"/>
      <rect x="24" y="14" width="6" height="4" rx="1"/>
      <rect x="14" y="2" width="4" height="6" rx="1" transform="rotate(45 16 16)"/>
      <rect x="14" y="24" width="4" height="6" rx="1" transform="rotate(45 16 16)"/>
      <rect x="2" y="14" width="6" height="4" rx="1" transform="rotate(45 16 16)"/>
      <rect x="24" y="14" width="6" height="4" rx="1" transform="rotate(45 16 16)"/>
    </g>
  </g>
</svg>
