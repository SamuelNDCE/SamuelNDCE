<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05060c"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .node { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
    .link { stroke-width: 1; opacity: 0.22; }
    .scanline { animation: scan 7s linear infinite; }
    @keyframes scan {
      0%   { transform: translateY(-40px); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    .title {
      font-family: 'Consolas','SFMono-Regular','Courier New',monospace;
      font-weight: 700; letter-spacing: 10px; fill: #22D3EE;
      filter: url(#glow); animation: breathe 3.6s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { opacity: 0.88; } 50% { opacity: 1; } }
    .subtitle {
      font-family: 'Consolas','SFMono-Regular','Courier New',monospace;
      letter-spacing: 5px; fill: #7C3AED; opacity: 0.9;
    }
    .hud { stroke: #22D3EE; stroke-width: 2; opacity: 0.55; fill: none; }
    .status { font-family: 'Consolas','SFMono-Regular','Courier New',monospace; font-size: 13px; fill: #22D3EE; opacity: 0.65; }
    .status-r { font-family: 'Consolas','SFMono-Regular','Courier New',monospace; font-size: 13px; fill: #7C3AED; opacity: 0.65; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50%,100% { opacity: 0; } 0% { opacity: 1; } }
  </style>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- neural mesh -->
  <g class="link" stroke="#22D3EE">
    <line x1="60" y1="40" x2="140" y2="90"/>
    <line x1="140" y1="90" x2="90" y2="160"/>
    <line x1="140" y1="90" x2="200" y2="50"/>
    <line x1="200" y1="50" x2="260" y2="140"/>
    <line x1="90" y1="160" x2="180" y2="220"/>
    <line x1="180" y1="220" x2="300" y2="250"/>
    <line x1="60" y1="40" x2="60" y2="240"/>
    <line x1="950" y1="40" x2="1020" y2="160"/>
    <line x1="1020" y1="160" x2="1080" y2="220"/>
    <line x1="1080" y1="220" x2="1000" y2="260"/>
    <line x1="1080" y1="220" x2="1140" y2="90"/>
    <line x1="1140" y1="90" x2="1150" y2="40"/>
    <line x1="950" y1="40" x2="1140" y2="90"/>
  </g>
  <g class="link" stroke="#7C3AED">
    <line x1="260" y1="140" x2="180" y2="220"/>
    <line x1="1020" y1="160" x2="950" y2="40"/>
    <line x1="90" y1="160" x2="60" y2="240"/>
    <line x1="1000" y1="260" x2="1080" y2="220"/>
  </g>
  <g class="node" fill="#22D3EE">
    <circle cx="60" cy="40" r="2.6"/>
    <circle cx="140" cy="90" r="3"/>
    <circle cx="90" cy="160" r="2.6"/>
    <circle cx="200" cy="50" r="2.2"/>
    <circle cx="260" cy="140" r="2.6"/>
    <circle cx="180" cy="220" r="2.4"/>
    <circle cx="300" cy="250" r="2.2"/>
    <circle cx="60" cy="240" r="2.4"/>
    <circle cx="950" cy="40" r="2.6"/>
    <circle cx="1020" cy="160" r="3"/>
    <circle cx="1080" cy="220" r="2.6"/>
    <circle cx="1000" cy="260" r="2.2"/>
    <circle cx="1140" cy="90" r="2.6"/>
    <circle cx="1150" cy="40" r="2.2"/>
  </g>

  <!-- HUD corner brackets -->
  <path class="hud" d="M24,56 L24,24 L56,24"/>
  <path class="hud" d="M1176,56 L1176,24 L1144,24"/>
  <path class="hud" d="M24,224 L24,256 L56,256"/>
  <path class="hud" d="M1176,224 L1176,256 L1144,256"/>

  <!-- scan line -->
  <rect class="scanline" x="0" y="0" width="1200" height="14" fill="url(#scan)"/>

  <!-- terminal status lines -->
  <text x="40" y="46" class="status">&gt;&gt; SYSTEM<tspan class="status-r">.STATUS</tspan> = ONLINE<tspan class="cursor">_</tspan></text>
  <text x="1000" y="252" text-anchor="end" class="status-r">BUILDING_THE_FUTURE<tspan class="cursor">_</tspan></text>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" class="title" font-size="54">SAMUEL E</text>
  <text x="600" y="182" text-anchor="middle" class="subtitle" font-size="16" filter="url(#glowSoft)">FOUNDER · AI ENGINEER · BUILDER</text>
</svg>
