<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0d18" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Consolas','SFMono-Regular','Courier New',monospace;
      font-weight: 700; letter-spacing: 10px; fill: #22D3EE;
      filter: url(#glow); animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { opacity: 0.88; } 50% { opacity: 1; } }
    .subtitle {
      font-family: 'Consolas','SFMono-Regular','Courier New',monospace;
      letter-spacing: 4px; fill: #7C3AED; opacity: 0.85;
    }
    .frame { animation: frameBreathe 4s ease-in-out infinite; }
    @keyframes frameBreathe { 0%,100% { stroke-opacity: 0.18; } 50% { stroke-opacity: 0.4; } }
  </style>

  <rect width="1200" height="240" fill="#0A0D18"/>
  <rect class="frame" x="24" y="24" width="1152" height="192" rx="8" fill="none" stroke="#22D3EE" stroke-width="1.5"/>

  <text x="600" y="128" text-anchor="middle" class="title" font-size="72">SAMUEL NDCE</text>
  <text x="600" y="168" text-anchor="middle" class="subtitle" font-size="18">ENTREPRENEUR · AGENTIC ENGINEER · DEVELOPER</text>

  <rect x="250" y="188" width="700" height="1" fill="url(#line)"/>
</svg>
