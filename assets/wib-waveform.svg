<svg width="100" height="32" viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    rect { animation: bar 1.1s ease-in-out infinite; transform-origin: bottom; }
    @keyframes bar { 0%,100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
  </style>
  <g fill="#22D3EE">
    <rect x="4"  y="10" width="6" height="14" rx="2" style="animation-delay:0.0s"/>
    <rect x="16" y="4"  width="6" height="26" rx="2" style="animation-delay:0.15s"/>
    <rect x="28" y="8"  width="6" height="18" rx="2" style="animation-delay:0.3s"/>
    <rect x="40" y="2"  width="6" height="30" rx="2" style="animation-delay:0.45s"/>
    <rect x="52" y="10" width="6" height="14" rx="2" style="animation-delay:0.6s"/>
    <rect x="64" y="6"  width="6" height="22" rx="2" style="animation-delay:0.75s"/>
    <rect x="76" y="10" width="6" height="14" rx="2" style="animation-delay:0.9s"/>
    <rect x="88" y="4"  width="6" height="26" rx="2" style="animation-delay:1.05s"/>
  </g>
</svg>
