<svg width="160" height="36" viewBox="0 0 160 36" xmlns="http://www.w3.org/2000/svg">
  <style>
    .n { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
  <g stroke="#22D3EE" stroke-width="1" opacity="0.35">
    <line x1="12" y1="10" x2="45" y2="8"/>
    <line x1="45" y1="8" x2="78" y2="20"/>
    <line x1="45" y1="8" x2="60" y2="28"/>
    <line x1="78" y1="20" x2="112" y2="12"/>
    <line x1="78" y1="20" x2="105" y2="28"/>
    <line x1="112" y1="12" x2="148" y2="16"/>
  </g>
  <g fill="#22D3EE">
    <circle class="n" cx="12" cy="10" r="2.6" style="animation-delay:0s"/>
    <circle class="n" cx="45" cy="8" r="2.6" style="animation-delay:0.3s"/>
    <circle class="n" cx="60" cy="28" r="2.2" style="animation-delay:0.6s"/>
    <circle class="n" cx="78" cy="20" r="2.6" style="animation-delay:0.9s"/>
    <circle class="n" cx="105" cy="28" r="2.2" style="animation-delay:1.2s"/>
    <circle class="n" cx="112" cy="12" r="2.6" style="animation-delay:0.4s"/>
    <circle class="n" cx="148" cy="16" r="2.6" style="animation-delay:1.5s"/>
  </g>
</svg>
