<svg width="1200" height="6" viewBox="0 0 1200 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0D18"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="6"/>
    </clipPath>
  </defs>
  <style>
    .shimmer { animation: sweep 3.5s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-300px); }
      100% { transform: translateX(1500px); }
    }
  </style>
  <rect width="1200" height="6" fill="url(#base)" opacity="0.5"/>
  <g clip-path="url(#clip)">
    <rect class="shimmer" x="0" y="0" width="180" height="6" fill="url(#shimmer)"/>
  </g>
</svg>
